name: Purge green run logs

# When a workflow run finishes green, delete its logs. Failed and
# cancelled runs keep their logs so they can be debugged.
#
# Also deletes the run's artifacts, but only when they were already
# copied into a published GitHub Release (the Release run's "Publish
# release" job succeeded). Build-only runs keep their artifacts, because
# those files are the download; their 3-day retention removes them.
# Release assets are never touched.
#
# Note: logs do not count toward the Actions storage limit (artifacts and
# caches do). Deleting logs only tidies the run history. Old artifacts and
# caches are handled by cleanup.yml every Monday.
#
# Run it by hand (Actions > Purge green run logs > Run workflow) to purge
# the logs of all earlier green runs once.

on:
  workflow_run:
    workflows: ["Release", "Clean up Actions storage"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  purge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const mb = (b) => (b / 1024 / 1024).toFixed(1) + " MB";
            // Treat "already gone" (404) as done.
            const del = async (fn, args) => {
              try { await fn(args); return true; }
              catch (e) { if (e.status === 404) return false; throw e; }
            };

            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              await del(github.rest.actions.deleteWorkflowRunLogs, { owner, repo, run_id: run.id });
              core.info(`deleted logs of ${run.name} run ${run.id} (${run.head_branch})`);

              // Artifacts: only when the release job already published them.
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, per_page: 100,
              });
              const published = jobs.some((j) => j.name === "Publish release" && j.conclusion === "success");
              if (!published) {
                core.info("no published release in this run; artifacts kept");
                return;
              }
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner, repo, run_id: run.id, per_page: 100,
              });
              let freed = 0;
              for (const a of artifacts) {
                if (a.expired) continue;
                if (!(await del(github.rest.actions.deleteArtifact, { owner, repo, artifact_id: a.id }))) continue;
                freed += a.size_in_bytes;
                core.info(`deleted artifact ${a.name} (${mb(a.size_in_bytes)}), already in the release`);
              }
              core.info(`artifacts freed: ${mb(freed)}`);
              return;
            }

            // By hand: purge logs of every earlier green run.
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, status: "success", per_page: 100,
            });
            let n = 0;
            for (const r of runs) {
              if (r.id === context.runId) continue;
              if (await del(github.rest.actions.deleteWorkflowRunLogs, { owner, repo, run_id: r.id })) n++;
            }
            core.info(`deleted logs of ${n} green runs`);
            await core.summary.addHeading("Purge green run logs").addRaw(`Deleted logs of ${n} green runs.`).write();
