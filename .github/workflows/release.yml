name: Release

# Builds the `mosaic` CLI and the `mosaic-gui` desktop app for
# Windows x64, macOS Apple silicon (.dmg) and Linux x64.
#
# - Push a tag like `v0.1.0` to build and publish a GitHub Release.
# - Run it by hand (Actions > Release > Run workflow) to only build; the
#   files are then available as workflow artifacts.
# - The macOS app is ad-hoc signed, not notarized. First launch needs
#   right-click > Open (or `xattr -dr com.apple.quarantine MosaiCxM.app`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Test-build when this workflow changes; nothing is published.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The workspace keeps line-table debug info in release builds; skip it for
  # shipped binaries to keep downloads small.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p mosaic -p mosaic-gui

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="mosaic-${VERSION}-linux-x64"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/{mosaic,mosaic-gui} README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "mosaic-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mosaic.exe", "target/${{ matrix.target }}/release/mosaic-gui.exe", README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          "ASSET=dist/$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          name="mosaic-${VERSION}-macos-arm64"
          bin="target/${{ matrix.target }}/release"
          app="dist/stage/MosaiCxM.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin/mosaic-gui" "$app/Contents/MacOS/"
          cp "$bin/mosaic" README.md dist/stage/

          # App icon from the UI's PNG.
          iconset=dist/AppIcon.iconset
          mkdir -p "$iconset"
          src=crates/mosaic-gui/ui/icon.png
          sips -z 16 16 "$src" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 "$src" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$src" --out "$iconset/icon_32x32.png" >/dev/null
          cp "$src" "$iconset/icon_32x32@2x.png"
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"

          short="${VERSION#v}"
          [[ "$short" == dev-* ]] && short="0.0.0"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MosaiCxM</string>
            <key>CFBundleDisplayName</key><string>MosaiCxM</string>
            <key>CFBundleIdentifier</key><string>io.github.nhth-mibu.mosaicxm</string>
            <key>CFBundleExecutable</key><string>mosaic-gui</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${short}</string>
            <key>CFBundleVersion</key><string>${short}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc signature so Apple silicon will run it (not notarized).
          codesign --force --deep --sign - "$app"
          codesign --force --sign - dist/stage/mosaic

          ln -s /Applications dist/stage/Applications
          hdiutil create -volname "MosaiCxM" -srcfolder dist/stage -ov -format UDZO "dist/$name.dmg"
          echo "ASSET=dist/$name.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
