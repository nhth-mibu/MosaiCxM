name: Release

# Builds the `mosaic-gui` desktop app for
# Windows x64, macOS Apple silicon (.dmg) and Linux x64.
#
# - Push a tag like `v0.1.0` to build and publish a GitHub Release.
# - Or run it by hand (Actions > Release > Run workflow) with a version
#   like `v0.7.2`: it builds the chosen branch, creates that tag and
#   publishes the release. This is how Claude releases, since it cannot
#   push tags.
# - Run it by hand with no version to only build; the files are then
#   available as workflow artifacts.
# - The macOS app is ad-hoc signed, not notarized. First launch needs
#   right-click > Open (or `xattr -dr com.apple.quarantine MosaiCxM.app`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create and publish, like v0.7.2. Leave empty to only build."
        required: false
        default: ""
  # Test-build when this workflow changes; nothing is published.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The workspace keeps line-table debug info in release builds; skip it for
  # shipped binaries to keep downloads small.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Set version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Version must look like v1.2.3, got '$INPUT_VERSION'"
              exit 1
            fi
            echo "VERSION=${INPUT_VERSION}" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p mosaic-gui

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="mosaic-${VERSION}-linux-x64"
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/mosaic-gui README.md "dist/$name/"
          cp crates/mosaic-gui/linux/mosaicxm.desktop crates/mosaic-gui/linux/install.sh "dist/$name/"
          cp crates/mosaic-gui/ui/icon.png "dist/$name/mosaicxm.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "mosaic-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mosaic-gui.exe", README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          "ASSET=dist/$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          name="mosaic-${VERSION}-macos-arm64"
          bin="target/${{ matrix.target }}/release"
          app="dist/stage/MosaiCxM.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$bin/mosaic-gui" "$app/Contents/MacOS/"
          cp README.md dist/stage/

          # App icon from the 1024 px master (see scripts/make_icons.py).
          iconset=dist/AppIcon.iconset
          mkdir -p "$iconset"
          src=crates/mosaic-gui/icons/icon-1024.png
          for px in 16 32 128 256 512; do
            sips -z $px $px "$src" --out "$iconset/icon_${px}x${px}.png" >/dev/null
            sips -z $((px*2)) $((px*2)) "$src" --out "$iconset/icon_${px}x${px}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"

          short="${VERSION#v}"
          [[ "$short" == dev-* ]] && short="0.0.0"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>MosaiCxM</string>
            <key>CFBundleDisplayName</key><string>MosaiCxM</string>
            <key>CFBundleIdentifier</key><string>io.github.nhth-mibu.mosaicxm</string>
            <key>CFBundleExecutable</key><string>mosaic-gui</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${short}</string>
            <key>CFBundleVersion</key><string>${short}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc signature so Apple silicon will run it (not notarized).
          codesign --force --deep --sign - "$app"

          ln -s /Applications dist/stage/Applications
          hdiutil create -volname "MosaiCxM" -srcfolder dist/stage -ov -format UDZO "dist/$name.dmg"
          echo "ASSET=dist/$name.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse to reuse an existing release
        if: inputs.version != ''
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.TAG, '-') }}
