[package]
name = "mosaic-gui"
version = "0.1.0"
edition = "2024"
description = "Desktop interface for the photo mosaic engine (Slint)"

[[bin]]
name = "mosaic-gui"
path = "src/main.rs"

[dependencies]
mosaic-core = { path = "../mosaic-core" }
slint = "1.18"
rfd = "0.17"
anyhow = "1"
base64 = "0.23.1"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }
webbrowser = "1"
opener = { version = "0.8", features = ["reveal"] }

[dev-dependencies]
tempfile = "3.27.0"
i-slint-backend-testing = { version = "1.18", features = ["renderer-software"] }

[build-dependencies]
slint-build = "1.18"
winresource = "0.1.34"
