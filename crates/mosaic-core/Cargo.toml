[package]
name = "mosaic-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
blake3 = "1.8.7"
fast_image_resize = "6.1.0"
flate2 = "1.1.10"
fs4 = "1.1.0"
resvg = { version = "0.48", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.7.1"
kamadak-exif = "0.6.1"
kiddo = "6.3.0"
moxcms = "0.9.1"
png = "0.18.1"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tract-onnx = "0.23.9"
walkdir = "2.5.0"

[dev-dependencies]
blake3 = "1.8.7"
jpeg-encoder = "0.7.1"
serde_json = "1.0.154"
tempfile = "3.27.0"
tiff = "0.11.3"
